</filter>
<filter id="blur50" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="55"/></filter>

<pattern id="hud_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
